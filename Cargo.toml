[workspace]
members = ["ocipkg", "ocipkg-cli"]
exclude = ["examples/static-exe", "examples/rust/lib", "examples/rust/exe"]
resolver = "2"

[workspace.package]
version = "0.4.1"
authors = ["Toshiki Teramura <toshiki.teramura@gmail.com>"]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/termoshtt/ocipkg"
readme = "README.md"

[workspace.dependencies]
anyhow = "1.0.101"
base16ct = { version = "1.0.0", features = ["alloc"] }
base64 = "0.22.1"
cargo_metadata = "0.23.1"
chrono = "0.4.43"
clap = { version = "4.5.57", features = ["derive"] }
colored = "3.1.1"
directories = "6.0.0"
env_logger = "0.11.8"
flate2 = "1.1.9"
git2 = "0.20.4"
goblin = "0.10.4"
lazy_static = "1.5.0"
log = "0.4.29"
maplit = "1.0.2"
oci-spec = "0.8.4"
regex = "1.12.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tar = "0.4.44"
tempfile = "3.25.0"
toml = "0.9.11"
ureq = { version = "3", features = ["json"] }
url = "2.5.8"
urlencoding = "2.1.3"
uuid = { version = "1.20.0", features = ["v4"] }
walkdir = "2.5.0"
